<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rätselbuch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rätselbuch">
<meta name="theme-color" content="#faf9f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home" class="screen">
  <header class="bar">
    <div class="left"><button id="sound" class="btn" aria-label="Ton an oder aus"></button><button id="level" class="btn wide" aria-label="Schwierigkeit umschalten"></button></div>
    <h1>rätselbuch</h1>
    <div class="stars" aria-label="Punkte"><i class="dot"></i><b class="starcount">0</b></div>
  </header>
  <div id="map" aria-label="Insel mit den Rätseln"></div>
  <div id="garage" aria-label="Garage"></div>
</section>

<section id="play" class="screen" hidden>
  <header class="bar">
    <button id="back" class="btn" aria-label="Zurück zur Insel"></button>
    <div class="aufgabe"><b id="task"></b><span id="hint"></span></div>
    <div class="stars" aria-label="Punkte"><i class="dot"></i><b class="starcount">0</b></div>
  </header>
  <main id="stage"></main>
  <div id="cheer" hidden>
    <div id="prize"></div>
    <button id="next" aria-label="Nächstes Rätsel"></button>
  </div>
</section>

<section id="bau" class="screen" hidden>
  <header class="bar">
    <button id="bauheim" class="btn" aria-label="Zurück zur Insel"></button>
    <div id="plaetze" class="left" aria-label="Bauplätze"></div>
    <div class="left"><button id="leeren" class="btn" aria-label="Bauplatz leeren"></button><button id="los" class="btn go" aria-label="Losfahren oder anhalten"></button></div>
  </header>
  <main id="brett"></main>
  <div id="teile" aria-label="Bauteile"></div>
</section>

<script src="app.js"></script>
</body>
</html>
